<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Stock Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .buy-signal { color: #16a34a; }
        .sell-signal { color: #dc2626; }
        .neutral-signal { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Indian Stock Signals</h1>
                <p class="text-gray-600 mt-2">Real-time trading signals, targets, and stop-loss for NSE stocks</p>
            </div>
            <div>
                <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">
                    Refresh Data
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Analyze Any NSE Stock</h2>
            <div class="flex gap-4">
                <div class="relative flex-1">
                    <input type="text" id="symbol-input" placeholder="Enter Symbol (e.g., RELIANCE, TCS, INFY)" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
                </div>
                <button id="search-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-md shadow">
                    Analyze
                </button>
            </div>
            <div id="search-result" class="mt-6 hidden">
                <!-- Result will be populated here -->
            </div>
            <div id="search-error" class="mt-4 text-red-600 hidden">
                <!-- Error will be shown here -->
            </div>
            <div id="search-loading" class="mt-4 text-gray-600 hidden">
                Loading analysis...
            </div>
        </div>

        <!-- Popular Stocks Grid -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Popular Stocks Dashboard</h2>
        <div id="loading" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-blue-600"></div>
            <p class="mt-2 text-gray-600">Loading real-time data...</p>
        </div>
        
        <div id="stocks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be populated here by JS -->
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        function getSignalClass(signal) {
            if (signal === 'BUY') return 'text-green-600 bg-green-100';
            if (signal === 'SELL') return 'text-red-600 bg-red-100';
            return 'text-gray-600 bg-gray-100';
        }

        function createStockCard(data) {
            const signalClass = getSignalClass(data.signal);
            
            let reasonsHtml = '';
            if (data.reasons && data.reasons.length > 0) {
                reasonsHtml = `
                    <div class="mt-3">
                        <p class="text-xs font-semibold text-gray-500 uppercase">Reasons:</p>
                        <ul class="text-sm text-gray-700 list-disc pl-5 mt-1">
                            ${data.reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            let tradeInfoHtml = '';
            if (data.signal !== 'NEUTRAL') {
                tradeInfoHtml = `
                    <div class="mt-4 grid grid-cols-2 gap-4 border-t pt-3">
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase">Target</p>
                            <p class="text-lg font-bold text-green-600">₹${data.target}</p>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase">Stop Loss</p>
                            <p class="text-lg font-bold text-red-600">₹${data.stop_loss}</p>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
                    <div class="p-5 border-b border-gray-100">
                        <div class="flex justify-between items-start">
                            <h3 class="text-xl font-bold text-gray-800">${data.ticker.replace('.NS', '')}</h3>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${signalClass}">${data.signal}</span>
                        </div>
                        <p class="text-3xl font-bold mt-2">₹${data.current_price.toLocaleString('en-IN')}</p>
                        <p class="text-xs text-gray-400 mt-1">Last Updated: ${new Date(data.last_updated).toLocaleTimeString()}</p>
                    </div>
                    <div class="p-5">
                        ${reasonsHtml}
                        
                        <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-gray-50 p-2 rounded">
                                <span class="block text-gray-500">RSI</span>
                                <span class="font-semibold">${data.indicators.rsi}</span>
                            </div>
                            <div class="bg-gray-50 p-2 rounded">
                                <span class="block text-gray-500">MACD</span>
                                <span class="font-semibold">${data.indicators.macd}</span>
                            </div>
                            <div class="bg-gray-50 p-2 rounded">
                                <span class="block text-gray-500">EMA20</span>
                                <span class="font-semibold">${data.indicators.ema20}</span>
                            </div>
                        </div>
                        
                        ${tradeInfoHtml}
                    </div>
                </div>
            `;
        }

        async function fetchPopularStocks() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('stocks-grid');
            
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/popular`);
                const data = await response.json();
                
                grid.innerHTML = data.map(stock => createStockCard(stock)).join('');
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (error) {
                console.error('Error fetching popular stocks:', error);
                loading.innerHTML = '<p class="text-red-500">Failed to load data. Ensure backend is running.</p>';
            }
        }

        async function searchStock() {
            const input = document.getElementById('symbol-input');
            const symbol = input.value.trim().toUpperCase();
            
            if (!symbol) return;
            
            const resultDiv = document.getElementById('search-result');
            const errorDiv = document.getElementById('search-error');
            const loadingDiv = document.getElementById('search-loading');
            
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/analyze/${symbol}`);
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                const data = await response.json();
                
                resultDiv.innerHTML = createStockCard(data);
                
                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error('Error analyzing stock:', error);
                loadingDiv.classList.add('hidden');
                errorDiv.textContent = 'Could not find data for that symbol. Try adding .NS or check spelling.';
                errorDiv.classList.remove('hidden');
            }
        }

        // Event Listeners
        document.getElementById('refresh-btn').addEventListener('click', fetchPopularStocks);
        document.getElementById('search-btn').addEventListener('click', searchStock);
        document.getElementById('symbol-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStock();
        });

        // Initial load
        fetchPopularStocks();
    </script>
</body>
</html>
