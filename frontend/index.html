<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Stock Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .buy-signal { color: #16a34a; }
        .sell-signal { color: #dc2626; }
        .neutral-signal { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans dark:bg-gray-900 transition-colors duration-200">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Indian Stock Signals</h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Real-time trading signals, targets, and stop-loss for NSE stocks</p>
                <div id="countdown-timer" class="text-sm font-semibold text-blue-600 dark:text-blue-400 mt-2">Refreshing in 03:00</div>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 dark:focus:ring-gray-500">
                    <span id="theme-toggle-light-icon" class="hidden">☀️</span>
                    <span id="theme-toggle-dark-icon" class="hidden">🌙</span>
                </button>
                <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">
                    Refresh Data
                </button>
            </div>
        </header>

        <!-- Watchlist Section -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">My Watchlist</h2>
            <div id="watchlist-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Watchlist cards will be populated here -->
                <p id="watchlist-empty" class="text-gray-500 dark:text-gray-400 italic col-span-full">Your watchlist is empty. Search for a stock to add it.</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 dark:text-white">Analyze Any NSE Stock</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="relative flex-1">
                    <input type="text" id="symbol-input" placeholder="Enter Symbol (e.g., RELIANCE, TCS, INFY)" 
                           class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase dark:bg-gray-700 dark:text-white">
                </div>
                <button id="search-btn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-md shadow">
                    Analyze
                </button>
            </div>
            <div id="search-result" class="mt-6 hidden">
                <!-- Result will be populated here -->
            </div>
            <div id="search-error" class="mt-4 text-red-600 dark:text-red-400 hidden">
                <!-- Error will be shown here -->
            </div>
            <div id="search-loading" class="mt-4 text-gray-600 dark:text-gray-400 hidden">
                Loading analysis...
            </div>
        </div>

        <!-- Popular Stocks Grid -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Popular Stocks Dashboard</h2>
            <div class="flex items-center gap-2">
                <label for="signal-filter" class="text-sm font-medium text-gray-700 dark:text-gray-300">Filter by Signal:</label>
                <select id="signal-filter" class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                    <option value="ALL">All Signals</option>
                    <option value="BUY">Buy</option>
                    <option value="SELL">Sell</option>
                    <option value="NEUTRAL">Neutral</option>
                </select>
            </div>
        </div>

        <div id="loading" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-blue-600 dark:border-gray-600 dark:border-t-blue-500"></div>
            <p class="mt-2 text-gray-600 dark:text-gray-400">Loading real-time data...</p>
        </div>
        
        <div id="stocks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be populated here by JS -->
        </div>
    </div>

    <script>
        const API_BASE = window.location.port === '3000'
            ? 'http://localhost:8000/api'
            : `${window.location.origin}/api`;

        function getSignalClass(signal) {
            if (signal === 'BUY') return 'text-green-600 bg-green-100';
            if (signal === 'SELL') return 'text-red-600 bg-red-100';
            return 'text-gray-600 bg-gray-100';
        }

        // Watchlist state
        let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];

        function toggleWatchlist(symbol) {
            if (watchlist.includes(symbol)) {
                watchlist = watchlist.filter(s => s !== symbol);
            } else {
                watchlist.push(symbol);
            }
            localStorage.setItem('watchlist', JSON.stringify(watchlist));

            // Re-render watchlist grid
            fetchWatchlistStocks();

            // Update buttons directly in the DOM to avoid unnecessary re-fetching
            document.querySelectorAll(`button[onclick="toggleWatchlist('${symbol}')"]`).forEach(btn => {
                const inWatchlist = watchlist.includes(symbol);
                btn.className = `text-sm font-semibold py-1 px-2 rounded border ${inWatchlist ? 'bg-indigo-100 text-indigo-700 border-indigo-200 dark:bg-indigo-900 dark:text-indigo-200 dark:border-indigo-700' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600'}`;
                btn.textContent = inWatchlist ? '★ Saved' : '+ Watchlist';
            });
        }

        function createStockCard(data, prefix = '') {
            const signalClass = getSignalClass(data.signal);
            const pureSymbol = data.ticker.replace('.NS', '');
            const inWatchlist = watchlist.includes(data.ticker);
            
            let reasonsHtml = '';
            if (data.reasons && data.reasons.length > 0) {
                reasonsHtml = `
                    <div class="mt-3">
                        <p class="text-xs font-semibold text-gray-500 uppercase">Reasons:</p>
                        <ul class="text-sm text-gray-700 list-disc pl-5 mt-1">
                            ${data.reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            let tradeInfoHtml = '';
            if (data.signal !== 'NEUTRAL') {
                tradeInfoHtml = `
                    <div class="mt-4 grid grid-cols-2 gap-4 border-t pt-3">
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase">Target</p>
                            <p class="text-lg font-bold text-green-600">₹${data.target}</p>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase">Stop Loss</p>
                            <p class="text-lg font-bold text-red-600">₹${data.stop_loss}</p>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="stock-card bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300" data-signal="${data.signal}">
                    <div class="p-5 border-b border-gray-100 dark:border-gray-700">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <h3 class="text-xl font-bold text-gray-800 dark:text-white">${pureSymbol}</h3>
                            <div class="flex gap-2 items-center flex-wrap">
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${signalClass}">${data.signal}</span>
                                <button onclick="toggleWatchlist('${data.ticker}')" class="text-sm font-semibold py-1 px-2 rounded border ${inWatchlist ? 'bg-indigo-100 text-indigo-700 border-indigo-200 dark:bg-indigo-900 dark:text-indigo-200 dark:border-indigo-700' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600'}">
                                    ${inWatchlist ? '★ Saved' : '+ Watchlist'}
                                </button>
                            </div>
                        </div>
                        <p class="text-3xl font-bold mt-2 dark:text-white">₹${data.current_price.toLocaleString('en-IN')}</p>
                        <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Last Updated: ${new Date(data.last_updated).toLocaleTimeString()}</p>
                    </div>
                    <div class="px-5 pt-3 pb-2 border-b border-gray-100 dark:border-gray-700 h-24">
                        <canvas id="chart-${prefix}${pureSymbol}" class="w-full h-full"></canvas>
                    </div>
                    <div class="p-5 dark:text-gray-300">
                        ${reasonsHtml}
                        
                        <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded">
                                <span class="block text-gray-500 dark:text-gray-400">RSI</span>
                                <span class="font-semibold dark:text-white">${data.indicators.rsi}</span>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded">
                                <span class="block text-gray-500 dark:text-gray-400">MACD</span>
                                <span class="font-semibold dark:text-white">${data.indicators.macd}</span>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded">
                                <span class="block text-gray-500 dark:text-gray-400">EMA20</span>
                                <span class="font-semibold dark:text-white">${data.indicators.ema20}</span>
                            </div>
                        </div>
                        
                        ${tradeInfoHtml}
                    </div>
                </div>
            `;
        }

        function renderChart(canvasId, dates, prices) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            // Destroy existing chart if it exists
            const existingChart = Chart.getChart(canvasId);
            if (existingChart) {
                existingChart.destroy();
            }

            const isDark = document.documentElement.classList.contains('dark');
            const gridColor = isDark ? '#374151' : '#f3f4f6';
            const textColor = isDark ? '#9ca3af' : '#6b7280';
            const lineColor = '#4f46e5'; // Indigo

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates.map(d => {
                        const date = new Date(d);
                        return `${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                    }),
                    datasets: [{
                        label: 'Price',
                        data: prices,
                        borderColor: lineColor,
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return `₹${context.parsed.y}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: false // Hide x axis for sparkline look
                        },
                        y: {
                            display: false, // Hide y axis
                            min: Math.min(...prices) * 0.999, // Tighten bounds
                            max: Math.max(...prices) * 1.001
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        async function fetchWatchlistStocks() {
            const grid = document.getElementById('watchlist-grid');
            const emptyMsg = document.getElementById('watchlist-empty');

            if (watchlist.length === 0) {
                grid.innerHTML = '';
                grid.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            grid.innerHTML = '<p class="text-gray-500 dark:text-gray-400 italic">Loading watchlist...</p>';

            try {
                const promises = watchlist.map(symbol => fetch(`${API_BASE}/analyze/${symbol}`).then(r => r.json()));
                const results = await Promise.all(promises);

                grid.innerHTML = results.map(stock => createStockCard(stock, 'wl-')).join('');

                // Render charts after adding to DOM
                results.forEach(stock => {
                    const pureSymbol = stock.ticker.replace('.NS', '');
                    if (stock.history && stock.history.dates && stock.history.prices) {
                        renderChart(`chart-wl-${pureSymbol}`, stock.history.dates, stock.history.prices);
                    }
                });
            } catch (error) {
                console.error('Error fetching watchlist:', error);
                grid.innerHTML = '<p class="text-red-500">Failed to load watchlist.</p>';
            }
        }

        async function fetchPopularStocks() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('stocks-grid');
            
            loading.classList.remove('hidden');
            grid.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/popular`);
                const data = await response.json();
                
                grid.innerHTML = data.map(stock => createStockCard(stock, 'pop-')).join('');

                // Render charts
                data.forEach(stock => {
                    const pureSymbol = stock.ticker.replace('.NS', '');
                    if (stock.history && stock.history.dates && stock.history.prices) {
                        renderChart(`chart-pop-${pureSymbol}`, stock.history.dates, stock.history.prices);
                    }
                });
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');

                // Apply current filter if any
                applySignalFilter();
            } catch (error) {
                console.error('Error fetching popular stocks:', error);
                loading.innerHTML = '<p class="text-red-500">Failed to load data. Ensure backend is running.</p>';
            }
        }

        function applySignalFilter() {
            const filterValue = document.getElementById('signal-filter').value;
            const grid = document.getElementById('stocks-grid');
            const cards = grid.querySelectorAll('.stock-card');

            cards.forEach(card => {
                if (filterValue === 'ALL' || card.getAttribute('data-signal') === filterValue) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        async function searchStock() {
            const input = document.getElementById('symbol-input');
            const symbol = input.value.trim().toUpperCase();
            
            if (!symbol) return;
            
            const resultDiv = document.getElementById('search-result');
            const errorDiv = document.getElementById('search-error');
            const loadingDiv = document.getElementById('search-loading');
            
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/analyze/${symbol}`);
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                const data = await response.json();
                
                resultDiv.innerHTML = createStockCard(data, 'search-');

                // Render chart
                const pureSymbol = data.ticker.replace('.NS', '');
                if (data.history && data.history.dates && data.history.prices) {
                    renderChart(`chart-search-${pureSymbol}`, data.history.dates, data.history.prices);
                }
                
                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error('Error analyzing stock:', error);
                loadingDiv.classList.add('hidden');
                errorDiv.textContent = 'Could not find data for that symbol. Try adding .NS or check spelling.';
                errorDiv.classList.remove('hidden');
            }
        }

        // Event Listeners
        document.getElementById('refresh-btn').addEventListener('click', () => {
            fetchPopularStocks();
            fetchWatchlistStocks();
            resetTimer();
        });
        document.getElementById('search-btn').addEventListener('click', searchStock);
        document.getElementById('symbol-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStock();
        });
        document.getElementById('signal-filter').addEventListener('change', applySignalFilter);

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }

        // Initialize Theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        updateThemeIcons();

        themeToggleBtn.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
            updateThemeIcons();
        });

        // Auto-refresh Timer Logic
        let timeLeft = 180; // 3 minutes
        const timerDisplay = document.getElementById('countdown-timer');
        let timerInterval;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `Refreshing in ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function resetTimer() {
            timeLeft = 180;
            updateTimerDisplay();
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    fetchPopularStocks();
                    fetchWatchlistStocks();
                    resetTimer();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        // Initial load
        fetchPopularStocks();
        fetchWatchlistStocks();
        startTimer();
    </script>
</body>
</html>
